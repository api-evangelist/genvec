name: Genvec
description: GenVec was a clinical-stage biopharmaceutical company founded in 1992 and headquartered
  in Gaithersburg, Maryland, that pioneered adenovector (AdenoVerse) gene-delivery technology to develop
  gene-based therapeutics and vaccines, including programs for hearing loss and balance disorders. Backed
  by Canaan Partners, ARCH Venture Partners, EDF Ventures and HealthCare Ventures, GenVec was acquired by
  Precigen (formerly Intrexon) on June 16, 2017 and no longer operates as an independent company. It has
  no public developer platform, API, or documentation surface; the genvec.com domain no longer resolves.
